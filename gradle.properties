org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# --- CubeClash build switches -------------------------------------------------
# Runs the whole app against in-memory fakes (no backend required). This mirrors
# the Flutter client's `--dart-define=USE_FAKE_DATA` switch, so both clients can be
# demoed offline while `cubeclash-backend` is still being built.
cubeclash.useFakeData=true

# 10.0.2.2 is the host machine as seen from the Android emulator.
cubeclash.apiBaseUrl=http://10.0.2.2:3000/v1/
cubeclash.socketUrl=http://10.0.2.2:3000
